<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logimaths</title>
<style>
:root{
  --bg:#0e1630; --grid:#1f2d52; --panel:#151f3d; --line:#33467a;
  --block:#22315a; --blockb:#4a5f99; --txt:#e3e9ff; --muted:#8c9cc9;
  --lit:#ffffff; --ok:#2ecc71; --ko:#ff4d4d; --accent:#ffc94d; --warn:#ff9f43;
}
*{box-sizing:border-box}
.pal,.block,.num,.port,#palette{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%}
body{margin:0;height:100vh;height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{margin:0;font-size:24px;letter-spacing:1px;font-weight:800}
h1 b{color:var(--accent)}
#titreAct{font-weight:700;font-size:15px}
#consigne{flex:1;min-width:260px;font-size:14px;color:var(--muted);line-height:1.35}
header button,footer button{font:inherit}
.btn{background:var(--block);color:var(--txt);border:1px solid var(--blockb);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);color:#1b1b1b;border-color:var(--accent);font-weight:700}
main{flex:1;display:flex;min-height:0}
#palette{width:240px;flex-shrink:0;background:var(--panel);padding:10px 12px;overflow:auto;border-right:1px solid var(--line)}
#palette h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:12px 0 6px}
.pal{background:var(--block);border:2px solid var(--blockb);border-radius:10px;padding:9px 10px;margin-bottom:8px;font-size:13px;cursor:grab;touch-action:none;user-select:none;position:relative}
.pal.cond{width:206px;height:112px;padding:0;background:none;border:none;border-radius:0;margin:0 auto 8px}
.pal.cond .bord,.pal.cond .face{position:absolute;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.pal.cond .bord{inset:0;background:#7a8fd6;transition:background .15s}
.pal.cond .face{inset:2px;background:var(--block);display:flex;align-items:center;justify-content:center;text-align:center;padding:0 44px;font-size:12px;line-height:1.2}
.pal.cond:hover .bord{background:var(--accent)}
.pal.start{border-color:var(--accent);border-radius:22px;text-align:center;font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:15px}
.minislot{display:inline-block;width:34px;height:18px;border:2px dashed var(--accent);border-radius:4px;vertical-align:middle}
.block.act{width:220px;height:62px}
.block.act .face{background:var(--block);border:3px solid #3fc1a5;border-radius:4px;font-size:15px;font-weight:700;padding:0 10px}
.pal.act{border-color:#3fc1a5;border-radius:4px;font-weight:600}
.pal.act::before{content:"⚙ ";color:#3fc1a5}
.var{display:inline-block;margin-left:14px;padding:2px 8px;border-radius:6px;border:2px solid #3fc1a5;font-size:17px;color:#3fc1a5}
.var.change{background:#3fc1a5;color:#06241d}
.block.out.calcul{height:auto !important;min-height:68px}
.block.out.calcul .face{position:relative;flex-direction:column;gap:3px;padding:8px 12px}
.rac{display:inline-flex;align-items:stretch;white-space:nowrap;vertical-align:bottom;line-height:1.15}
.rac>i{font-style:normal;font-size:1.12em;line-height:1.05;margin-right:-1px}
.rac>span{display:inline-block;border-top:1.6px solid currentColor;padding:0 3px 0 2px;line-height:1.15;margin-top:1px}
.egal{display:grid;grid-template-columns:auto auto auto;column-gap:6px;row-gap:4px;align-items:end}
.egal .g{text-align:left}
.egal .g:first-child,.egal .g:nth-child(3n+1){text-align:right}
.egal .plein{grid-column:1 / 4;text-align:center}
.calc.flash{animation:flashLigne .55s ease-out}
@keyframes flashLigne{0%{background:#fff;color:#111;box-shadow:0 0 14px 4px rgba(255,255,255,.9)}60%{background:#fff;color:#111}100%{background:transparent;box-shadow:none}}
.calc{font-size:15px;font-weight:800}
.slot.change{background:#3fc1a5 !important;color:#06241d !important}
.pal.out::before{content:"■ ";color:var(--accent)}
.pal:hover{border-color:var(--accent)}
.pal.pris{opacity:.35;cursor:not-allowed;border-style:dashed}
.pal.pris:hover{border-color:var(--blockb)}
.aide{font-size:12px;color:var(--muted);line-height:1.4;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
#zoneBox{flex:1;position:relative;min-width:0;min-height:0}
#zone{position:absolute;inset:0;overflow:auto}
#wsWrap{position:relative}
#zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:6}
#zoom .btn{width:42px;height:42px;font-size:22px;font-weight:700;padding:0;opacity:.9}
#ws{position:absolute;left:0;top:0;transform-origin:0 0;width:1200px;height:1100px;background-image:radial-gradient(var(--grid) 1.6px,transparent 1.6px);background-size:24px 24px}
svg#links{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
svg#links path.vis{fill:none;stroke:#6f83bd;stroke-width:3}
svg#links path.vis.lit{stroke:var(--lit);stroke-width:4;filter:drop-shadow(0 0 6px #fff)}
svg#links path.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
svg#links path.hit:hover + path.vis{stroke:var(--ko)}
.block{position:absolute;z-index:2;touch-action:none;user-select:none;cursor:grab;color:var(--txt);transition:filter .2s}
.block.dragging{cursor:grabbing;z-index:5}
.block .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;transition:background .25s,color .25s,box-shadow .25s,border-color .25s}
/* départ */
.block.start{width:190px;height:60px}
.block.start .face{background:#2d3f73;border:3px solid var(--accent);border-radius:30px;font-size:20px;font-weight:700;font-family:ui-monospace,Consolas,monospace}
/* condition (losange) */
.block.cond{width:240px;height:150px}
.block.cond .bord,.block.cond .face{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.block.cond .bord{position:absolute;inset:0;background:#7a8fd6;transition:background .25s}
.block.cond .face{inset:3px;background:var(--block);font-size:13.5px;line-height:1.25;padding:0 58px}
/* sorties */
.block.out{width:210px;height:68px}
.block.out .face{background:var(--block);border:3px solid var(--blockb);border-radius:8px;font-size:14px;line-height:1.2;font-weight:600;padding:0 10px}
/* états */
.block.lit .face{background:var(--lit);color:#111;box-shadow:0 0 22px 6px rgba(255,255,255,.55)}
.block.cond.lit .bord{background:#fff}
.block.cond.lit{filter:drop-shadow(0 0 14px rgba(255,255,255,.8))}
.block.start.lit .face{border-color:#fff}
.block.out.ok .face{background:var(--ok);border-color:#a8ffcb;color:#06240f;box-shadow:0 0 26px 8px rgba(46,204,113,.6)}
.block.out.ko .face{background:var(--ko);border-color:#ffc2c2;color:#2a0505;box-shadow:0 0 26px 8px rgba(255,77,77,.6)}
.block.stuck .face{box-shadow:0 0 0 4px var(--warn)}
.block.cond.stuck .bord{background:var(--warn)}
/* ports */
.port{position:absolute;width:calc(24px / var(--E,1));height:calc(24px / var(--E,1));transform:translate(-50%,-50%);border-radius:50%;background:var(--accent);border:calc(3px / var(--E,1)) solid #1b1b1b;cursor:pointer;z-index:3;touch-action:none}
.port:hover{transform:translate(-50%,-50%) scale(1.15)}
.port.sel{animation:pulse .8s infinite alternate;background:#fff}
.port.used{background:#9fb2ea}
#tmpG path{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:9 6}
.port.in.vise{transform:translate(-50%,-50%) scale(1.45);background:#fff;box-shadow:0 0 12px 4px rgba(255,201,77,.9)}
body.cible .port.in{box-shadow:0 0 0 4px rgba(255,201,77,.45)}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,201,77,.9)}to{box-shadow:0 0 0 10px rgba(255,201,77,0)}}
.plabel{position:absolute;font-size:calc(12px / var(--E,1));font-weight:800;color:var(--muted);pointer-events:none;transition:color .2s}
.plabel.lit{color:#fff;text-shadow:0 0 6px #fff}
.del{position:absolute;top:-10px;right:-10px;width:calc(28px / var(--E,1));height:calc(28px / var(--E,1));border-radius:50%;background:#c0392b;color:#fff;border:2px solid #fff;font-size:calc(18px / var(--E,1));font-weight:700;line-height:calc(23px / var(--E,1));text-align:center;cursor:pointer;z-index:4;display:none}
.block:hover .del,.block.touch .del{display:block}
.block.cond .del{top:10px;right:42px}
@media (hover:none){ .block .del{display:block} }
#ghost{position:fixed;pointer-events:none;z-index:50;opacity:.85;display:none;background:var(--block);border:2px dashed var(--accent);border-radius:10px;padding:8px 10px;font-size:13px;max-width:220px}
footer{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.ligne{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ligne .lab{font-size:13px;color:var(--muted);margin-right:4px}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:36px;margin-left:8px;border:3px dashed var(--accent);border-radius:8px;background:rgba(0,0,0,.25);color:var(--txt);padding:0 8px;transition:all .15s}
.slot.plein{border-style:solid;background:#101a36}
.slot.survol{background:var(--accent);color:#1b1b1b;transform:scale(1.12)}
.block.start.lit .slot{background:#fff;color:#111;border-color:#111}
.num{touch-action:none;user-select:none;cursor:grab}
.num.fig{padding:2px 4px;line-height:0}
.slot svg.fig{display:block}
.slot:has(svg){height:auto;min-height:36px;padding:2px 4px}
#ghost svg.fig{display:block}
.num{min-width:52px;font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:700;background:var(--block);color:var(--txt);border:2px solid var(--blockb);border-radius:8px;padding:6px 10px;cursor:pointer}
.num:hover{border-color:var(--accent)}
.num.ok{background:var(--ok);border-color:var(--ok);color:#06240f}
.num.ko{background:var(--ko);border-color:var(--ko);color:#2a0505}
.num.cur{outline:3px solid #fff;outline-offset:2px}
#msg{font-size:15px;min-height:22px}
#msg.ok{color:var(--ok);font-weight:700}
#msg.ko{color:var(--ko);font-weight:700}
#msg.warn{color:var(--warn);font-weight:700}
#bravo{position:fixed;inset:0;background:rgba(5,10,25,.75);display:none;align-items:center;justify-content:center;z-index:100}
#bravo .carte{background:var(--panel);border:3px solid var(--ok);border-radius:16px;padding:28px 34px;text-align:center;max-width:420px}
#bravo h2{margin:0 0 8px;color:var(--ok);font-size:28px}
/* ---------- téléphone ---------- */
@media (max-width:760px){
  header{gap:6px 10px;padding:6px 10px}
  h1{font-size:19px}
  header > div:has(select){flex:1;min-width:0}
  #choixAct{width:100%;font-size:13px;padding:5px 6px}
  #btnVider{padding:5px 9px}
  #btnVider .txt{display:none}
  #consigne{order:5;flex-basis:100%;min-width:0;font-size:12.5px;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  #consigne.ouvert{-webkit-line-clamp:unset;display:block}
  main{flex-direction:column}
  #palette{width:auto;max-height:none;flex-shrink:0;border-right:none;border-bottom:1px solid var(--line);
    display:flex;flex-wrap:nowrap;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 8px}
  #palette h3,.aide{display:none}
  .pal{flex:0 0 auto;margin:0;font-size:12px;padding:6px 8px;max-width:170px}
  .pal.start{font-size:13px;padding:6px 10px}
  .pal.cond{width:150px;height:78px;margin:0}
  .pal.cond .face{font-size:10.5px;padding:0 30px}
  footer{padding:6px 10px;gap:5px}
  footer .ligne{flex-wrap:nowrap}
  #nombres{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px}
  footer .ligne:first-child{flex-direction:column;align-items:stretch;gap:3px}
  .ligne .lab{font-size:12px}
  .num{flex:0 0 auto;font-size:15px;padding:4px 8px;min-width:40px}
  .num svg.fig{width:84px;height:62px}
  footer .btn{font-size:13px;padding:6px 10px}
  #msg{font-size:13px;min-height:18px}
  #zoom .btn{width:38px;height:38px}
}
</style>
</head>
<body>
<header>
  <h1>Logi<b>maths</b></h1>
  <div>
    <select id="choixAct" class="btn"></select>
  </div>
  <div id="consigne"></div>
  <button class="btn" id="btnVider" title="Effacer le logigramme">🗑<span class="txt"> Tout effacer</span></button>
</header>

<main>
  <aside id="palette"></aside>
  <div id="zoneBox">
  <div id="zone">
    <div id="wsWrap"><div id="ws">
      <svg id="links" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f83bd"/></marker>
          <marker id="flTmp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffc94d"/></marker>
          <marker id="flLit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker>
        </defs>
        <g id="linksG"></g>
        <g id="tmpG"></g>
      </svg>
    </div></div>
  </div>
  <div id="zoom"><button class="btn" id="zMoins" title="Dézoomer">−</button><button class="btn" id="zPlus" title="Zoomer">+</button></div>
  </div>
</main>

<footer>
  <div class="ligne">
    <span class="lab" id="labNombres">Glisse un nombre dans la case :</span>
    <span id="nombres" class="ligne"></span>
  </div>
  <div class="ligne">
    <button class="btn main" id="btnLancer">▶ Lancer la vérification</button>
    <button class="btn" id="btnTous">⏩ Tout tester</button>
  </div>
  <div id="msg">Construis ta machine, glisse une valeur dans la case jaune, puis lance la vérification.</div>
</footer>

<div id="ghost"></div>
<div id="bravo"><div class="carte"><h2>Bravo ! 🎉</h2><p id="bravoTxt"></p><button class="btn main" id="btnFermer">Continuer</button></div></div>

<script>
/* =====================================================================
   ACTIVITÉS — pour ajouter une activité, copier un objet de ce tableau.
   ===================================================================== */
// racine carrée dont la barre couvre tout le calcul (sans parenthèses)
function rac(x){ return `<span class="rac"><i>√</i><span>${x}</span></span>`; }
// écriture décimale française (virgule)
const fr = x => String(x).replace(".", ",");
// h² = a² + b² ? (avec une petite tolérance pour les décimaux)
const egalite = (h, a, b) => Math.abs(h*h - a*a - b*b) < 1e-9;

const ACTIVITES = [
  {
    id: "multiple10",
    titre: "Activité 0 — Multiple de 10",
    consigne: "Construis une machine qui vérifie si un nombre <b>n</b> est un multiple de 10. " +
              "Place les blocs, relie-les avec des flèches, glisse un nombre dans la case et lance la vérification.",
    conditions: [
      { key: "u0", texte: "Le chiffre des unités de n est 0", test: n => n % 10 === 0 }
    ],
    sorties: [
      { key: "oui", texte: "n est un multiple de 10" },
      { key: "non", texte: "n n'est pas un multiple de 10" }
    ],
    attendu: n => (n % 10 === 0 ? "oui" : "non"),
    nombres: [30, 45, 7, 100, 250, 81, 2020, 15]
  },
  {
    id: "multiple5",
    titre: "Activité 1 — Multiple de 5",
    consigne: "Construis une machine qui vérifie si un nombre <b>n</b> est un multiple de 5. " +
              "Place les blocs, relie-les avec des flèches, glisse un nombre dans la case et lance la vérification.",
    conditions: [
      { key: "u0", texte: "Le chiffre des unités de n est 0", test: n => n % 10 === 0 },
      { key: "u5", texte: "Le chiffre des unités de n est 5", test: n => n % 10 === 5 }
    ],
    sorties: [
      { key: "oui", texte: "n est un multiple de 5" },
      { key: "non", texte: "n n'est pas un multiple de 5" }
    ],
    // bonne réponse attendue pour un nombre n
    attendu: n => (n % 5 === 0 ? "oui" : "non"),
    nombres: [20, 35, 47, 5, 130, 58, 2025, 101]
  },
  {
    id: "pythagore-longueur",
    titre: "Activité 3 — Calculer une longueur avec le théorème de Pythagore",
    consigne: "Les côtés d'un triangle sont notés a, b et c. On connaît b et c. " +
              "Construis une machine qui permet de retrouver la longueur du troisième côté a.",
    entree: "Le triangle :",
    largeurDepart: 420, hauteurDepart: 146,
    // chaque valeur : longueurs b et c connues, hyp = côté hypoténuse ("a", "c") ou null si le triangle n'est pas rectangle
    affiche: t => figureLongueur(t),
    nomEntree: t => `le triangle n°${act.nombres.indexOf(t) + 1}`,
    etatInitial: t => ({ t }),
    conditions: [
      { key: "rect", texte: "Le triangle est rectangle", test: e => e.t.hyp != null },
      { key: "ahyp", texte: "a est l'hypoténuse", test: e => e.t.hyp === "a" }
    ],
    // les actions écrivent les étapes du calcul ; la machine vérifie qu'elles sont faites dans le bon ordre
    actions: [
      { key: "eqA", texte: "c² + b² = a²", f: e => ({ ...e, eq: "a" }) },
      { key: "eqC", texte: "a² + b² = c²", f: e => ({ ...e, eq: "c" }) },
      { key: "isole", texte: "a² = c² − b²", f: e => ({ ...e, isole: e.eq === "c" }) }
    ],
    sorties: [
      { key: "moins", texte: "a = " + rac("c² − b²") },
      { key: "plus", texte: "a = " + rac("c² + b²") },
      { key: "nc", texte: "On ne peut pas utiliser le théorème de Pythagore" }
    ],
    attendu: t => (t.hyp === "a" ? "plus" : t.hyp === "c" ? "moins" : "nc"),
    // bonne fin, mais il faut aussi être passé par les bonnes égalités
    valide: (t, e, fin) => {
      const att = t.hyp === "a" ? "plus" : t.hyp === "c" ? "moins" : "nc";
      if (fin !== att) return false;
      if (fin === "plus" && e.eq !== "a") return "etape";
      if (fin === "moins" && !(e.eq === "c" && e.isole)) return "etape";
      return true;
    },
    // quand la machine arrive sur une Fin de calcul : égalité avec les valeurs, puis valeur de a
    detailFin: (t, fin) => {
      if (fin === "nc") return null;
      const sq = fin === "plus" ? t.c*t.c + t.b*t.b : t.c*t.c - t.b*t.b;
      const l1 = "a = " + rac(`${fr(t.c)}² ${fin === "plus" ? "+" : "−"} ${fr(t.b)}²`);
      if (sq < 0) return [l1, "impossible : " + fr(t.c) + "² − " + fr(t.b) + "² < 0"];
      const a = Math.sqrt(sq);
      // étape intermédiaire : le terme sous la racine est calculé
      return [l1, "a = " + rac(fr(Math.round(sq * 100) / 100)), Number.isInteger(a) ? `a = ${a}` : `a ≈ ${fr(Math.round(a * 100) / 100)}`];
    },
    bilan: (t, e) => t.hyp === "a" ? `a = ${rac(`${t.c}² + ${t.b}²`)} = ${rac(t.c*t.c + t.b*t.b)} = ${fr(Math.sqrt(t.c*t.c + t.b*t.b))}.`
                   : t.hyp === "c" ? `a = ${rac(`${t.c}² − ${t.b}²`)} = ${rac(t.c*t.c - t.b*t.b)} = ${fr(Math.sqrt(t.c*t.c - t.b*t.b))}.` : "",
    nombres: [{ b: 3, c: 4, hyp: "a" }, { b: 6, c: 10, hyp: "c" }, { b: 5, c: 12, hyp: "a" }, { b: 4, c: 6, hyp: null, aDessin: 5 },
              { b: 9, c: 15, hyp: "c" }, { b: 8, c: 6, hyp: "a" }, { b: 7, c: 25, hyp: "c" }, { b: 5, c: 7, hyp: null, aDessin: 6.2 }]
  },
  {
    id: "pythagore-direct",
    titre: "Activité 4 — Théorème de Pythagore",
    consigne: "On connaît les angles d'un triangle ABC. " +
              "Construis une machine qui indique ce que le théorème de Pythagore permet de conclure.",
    entree: "Triangle ABC :",
    largeurDepart: 380, hauteurDepart: 132,
    // chaque valeur est un triangle donné par ses angles [Â, B̂, Ĉ] en degrés
    affiche: t => figureAngles(t),
    nomEntree: t => `le triangle n°${act.nombres.indexOf(t) + 1}`,
    conditions: [
      { key: "rectA", texte: "Le triangle ABC est rectangle en A", test: t => t[0] === 90 },
      { key: "rectB", texte: "Le triangle ABC est rectangle en B", test: t => t[1] === 90 },

/* ===================== Figures de triangles (avec codage) ===================== */
// orientation différente pour chaque figure, pour que l'élève ne se fie pas à la position
const ROTATIONS = [0, 22, 165, -18, 190, 32, -28, 172];
function dessinTriangle(P, opts){
  const W = opts.W || 150, H = opts.H || 110, pad = opts.pad || 20, padHaut = Math.max(26, pad);
  const r = (opts.rot || 0) * Math.PI / 180, co = Math.cos(r), si = Math.sin(r);
  const q = {};
  for (const k of "ABC"){ const [x, y] = P[k]; q[k] = [x*co - y*si, x*si + y*co]; }
  const xs = [q.A[0], q.B[0], q.C[0]], ys = [q.A[1], q.B[1], q.C[1]];
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const sc = Math.min((W - 2*pad) / (maxx - minx || 1), (H - pad - padHaut) / (maxy - miny || 1));
  const ox = (W - (maxx - minx) * sc) / 2, oy = pad + (H - pad - padHaut - (maxy - miny) * sc) / 2;
  const S = {};
  for (const k of "ABC") S[k] = [ox + (q[k][0] - minx) * sc, H - (oy + (q[k][1] - miny) * sc)];
  const G = [(S.A[0] + S.B[0] + S.C[0]) / 3, (S.A[1] + S.B[1] + S.C[1]) / 3];
  const u = (p, o) => { const dx = p[0] - o[0], dy = p[1] - o[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  const f = v => v.toFixed(1);
  let svg = `<svg class="fig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  if (opts.numero) svg += `<text x="4" y="12" font-size="11" font-weight="700" fill="currentColor" opacity=".75">n°${opts.numero}</text>`;
  svg += `<polygon points="${["A","B","C"].map(k => f(S[k][0]) + "," + f(S[k][1])).join(" ")}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>`;
  // angle droit
  if (opts.droit){
    const V = S[opts.droit], [k1, k2] = "ABC".replace(opts.droit, "").split("");
    const a = u(S[k1], V), b = u(S[k2], V), d = 9;
    svg += `<polyline points="${f(V[0]+a[0]*d)},${f(V[1]+a[1]*d)} ${f(V[0]+a[0]*d+b[0]*d)},${f(V[1]+a[1]*d+b[1]*d)} ${f(V[0]+b[0]*d)},${f(V[1]+b[1]*d)}" fill="none" stroke="currentColor" stroke-width="1.5"/>`;
  }
  // mesures d'angles écrites sur la figure (arc + valeur)
  (opts.angles || []).forEach(([k, txt]) => {
    const V = S[k], [k1, k2] = "ABC".replace(k, "").split("");
    const a = u(S[k1], V), b = u(S[k2], V), R = 11;
    const sweep = a[0]*b[1] - a[1]*b[0] > 0 ? 1 : 0;
    svg += `<path d="M${f(V[0]+a[0]*R)} ${f(V[1]+a[1]*R)} A${R} ${R} 0 0 ${sweep} ${f(V[0]+b[0]*R)} ${f(V[1]+b[1]*R)}" fill="none" stroke="currentColor" stroke-width="1.4"/>`;
    const bi = u([a[0]+b[0], a[1]+b[1]], [0, 0]);
    svg += `<text x="${f(V[0]+bi[0]*24)}" y="${f(V[1]+bi[1]*24)}" font-size="10" font-weight="600" fill="currentColor" text-anchor="middle" dominant-baseline="central">${txt}</text>`;
  });
  // côtés de même longueur (petits traits)
  (opts.traits || []).forEach(([k1, k2]) => {
    const M = [(S[k1][0] + S[k2][0]) / 2, (S[k1][1] + S[k2][1]) / 2], t = u(S[k2], S[k1]), n = [-t[1], t[0]];
    svg += `<line x1="${f(M[0]-n[0]*5)}" y1="${f(M[1]-n[1]*5)}" x2="${f(M[0]+n[0]*5)}" y2="${f(M[1]+n[1]*5)}" stroke="currentColor" stroke-width="1.8"/>`;
  });
  // longueurs écrites sur les côtés
  (opts.longueurs || []).forEach(([k1, k2, txt, couleur]) => {
    const M = [(S[k1][0] + S[k2][0]) / 2, (S[k1][1] + S[k2][1]) / 2], o = u(M, G);
    svg += `<text x="${f(M[0]+o[0]*(opts.ecart || 11))}" y="${f(M[1]+o[1]*(opts.ecart || 11))}" font-size="${couleur ? 12 : 10.5}" font-weight="${couleur ? 800 : 600}" fill="${couleur || "currentColor"}" text-anchor="middle" dominant-baseline="central">${txt}</text>`;
  });
  // noms des sommets
  if (!opts.sansSommets) for (const k of "ABC"){
    const o = u(S[k], G);
    svg += `<text x="${f(S[k][0]+o[0]*9)}" y="${f(S[k][1]+o[1]*9)}" font-size="11" font-weight="700" fill="currentColor" text-anchor="middle" dominant-baseline="central">${k}</text>`;
  }
  return svg + "</svg>";
}
// triangle connu par ses côtés a = BC, b = AC, c = AB
function sommets(a, b, c){
  const x = (c*c - b*b + a*a) / (2*a), y = Math.sqrt(Math.max(0, c*c - x*x));
  return { B: [0, 0], C: [a, 0], A: [x, y] };
}
// activité 3 : triangle donné par ses angles [Â, B̂, Ĉ] → codage de l'angle droit et des côtés égaux
function figureAngles(t){
  const i = act.nombres.indexOf(t);
  const rad = x => x * Math.PI / 180;
  const P = sommets(Math.sin(rad(t[0])), Math.sin(rad(t[1])), Math.sin(rad(t[2])));
  const droit = t[0] === 90 ? "A" : t[1] === 90 ? "B" : t[2] === 90 ? "C" : null;
  const traits = [];
  if (t[0] === t[1]) traits.push(["B","C"], ["A","C"]);
  if (t[0] === t[2]) traits.push(["B","C"], ["A","B"]);
  if (t[1] === t[2]) traits.push(["A","C"], ["A","B"]);
  const uniq = [...new Map(traits.map(p => [p.join(""), p])).values()];
  const angles = ((act.anglesAffiches || {})[i] || []).map(k => [k, t["ABC".indexOf(k)] + "°"]);
  return dessinTriangle(P, { rot: ROTATIONS[i % 8], droit, traits: uniq, angles, numero: i + 1 });
}
// triangle dont les côtés sont nommés a, b, c ; a est inconnu (« a = ? »)
function figureLongueur(t){
  const i = act.nombres.indexOf(t);
  const a = t.hyp === "a" ? Math.sqrt(t.b*t.b + t.c*t.c) : t.hyp === "c" ? Math.sqrt(t.c*t.c - t.b*t.b) : t.aDessin;
  const P = sommets(a, t.b, t.c);
  const droit = t.hyp === "a" ? "A" : t.hyp === "c" ? "C" : null;
  return dessinTriangle(P, { rot: ROTATIONS[i % 8], numero: i + 1, droit, sansSommets: true, W: 150, H: 112, pad: 28, ecart: 13,
    longueurs: [["B","C", "a=?", "#3d8bff"], ["A","C", "b=" + fr(t.b)], ["A","B", "c=" + fr(t.c)]] });
}
// activité 4 : triangle donné par ses longueurs [AB, AC, BC] → longueurs écrites sur la figure
function figureCotes(t){
  const i = act.nombres.indexOf(t);
  const P = sommets(t[2], t[1], t[0]);
  return dessinTriangle(P, { rot: ROTATIONS[i % 8], numero: i + 1,
    longueurs: [["A","B", fr(t[0])], ["A","C", fr(t[1])], ["B","C", fr(t[2])]] });
}
const nom = v => act.nomEntree ? act.nomEntree(v) : "n = " + v;
const Nom = v => { const t = nom(v); return t.charAt(0).toUpperCase() + t.slice(1); };

function etatInitial(){

  blocks = []; links = []; nextId = 1;
}
function sauver(){
  // on n'enregistre pas les lumières du dernier test
  const tmp = ["lit", "res", "stuck", "portLit", "val", "cur", "extra", "extraNew"];
  try { localStorage.setItem("logimaths-" + act.id, JSON.stringify({ blocks, links, nextId }, (k, v) => tmp.includes(k) ? undefined : v)); } catch(e){}
}
function charger(){
  try {
    const d = JSON.parse(localStorage.getItem("logimaths-" + act.id));
    if (d && Array.isArray(d.blocks)) {
      blocks = d.blocks; links = d.links; nextId = d.nextId;
      // une seule sortie de chaque type : on fusionne les doublons des anciennes sauvegardes
      const garde = {};
      blocks.filter(b => b.type === "out").forEach(b => {
        if (!garde[b.key]) { garde[b.key] = b.id; return; }
        links.forEach(l => { if (l.to === b.id) l.to = garde[b.key]; });
        blocks = blocks.filter(x => x.id !== b.id);
      });
      return;
    }
  } catch(e){}
  etatInitial();
}

/* ===================== Chargement d'une activité ===================== */
function chargerActivite(i){
  act = ACTIVITES[i];
  $("#consigne").innerHTML = act.consigne;
  const pal = $("#palette");
  pal.innerHTML = "<h3>Début</h3>";
  pal.appendChild(itemPalette("start", "debut", `${act.entree || "n ="} <span class="minislot"></span>`));
  pal.insertAdjacentHTML("beforeend", "<h3>Conditions</h3>");
  act.conditions.forEach(c => pal.appendChild(itemPalette("cond", c.key, c.texte)));
  if (act.actions){
    pal.insertAdjacentHTML("beforeend", "<h3>Actions</h3>");
    act.actions.forEach(a => pal.appendChild(itemPalette("act", a.key, a.texte)));
  }
  pal.insertAdjacentHTML("beforeend", "<h3>Fin</h3>");
  act.sorties.forEach(s => pal.appendChild(itemPalette("out", s.key, s.texte)));
  const nb = $("#nombres"); nb.innerHTML = "";
  act.nombres.forEach((v, i) => {
    const b = document.createElement("button");
    b.className = "num" + (act.affiche ? " fig" : ""); b.innerHTML = aff(v); b.dataset.n = i;
    b.addEventListener("pointerdown", e => dragNombre(e, i));
    nb.appendChild(b);
  });
  DIM.start.w = act.largeurDepart || 190; DIM.start.h = act.hauteurDepart || 60;
  $("#labNombres").textContent = act.affiche ? "Glisse un triangle dans la case :" : "Glisse un nombre dans la case :";
  nCourant = null; charger(); rendu(); effacerEtats();
}

function itemPalette(type, key, texte){
  const d = document.createElement("div");
  d.className = "pal " + type; d.dataset.key = key;
  if (type === "cond") d.innerHTML = `<div class="bord"></div><div class="face">${texte}</div>`;
  else d.innerHTML = texte;
  d.addEventListener("pointerdown", e => dragPalette(e, type, key, texte));
  return d;
}

/* ===================== Rendu ===================== */
function texteBloc(b){
  if (b.type === "start"){
    const i = b.val ?? nCourant;
    if (act.variables){
      const vars = act.variables.map(x => {
        const val = b.cur ? b.cur[x] : undefined;
        return `<span class="var${val != null ? " change" : ""}">${x} = ${val != null ? val : "?"}</span>`;
      }).join("");
      return `${act.entree || "n ="} <span class="slot${i != null ? " plein" : ""}">${i != null ? aff(act.nombres[i]) : ""}</span>${vars}`;
    }
    const contenu = b.cur != null ? aff(b.cur) : (i != null ? aff(act.nombres[i]) : "");
    return `${act.entree || "n ="} <span class="slot${i != null ? " plein" : ""}${b.cur != null && b.cur !== act.nombres[i] ? " change" : ""}">${contenu}</span>`;
  }
  if (b.type === "cond") return act.conditions.find(c => c.key === b.key)?.texte ?? "?";
  if (b.type === "act") return (act.actions || []).find(a => a.key === b.key)?.texte ?? "?";
  const t = act.sorties.find(s => s.key === b.key)?.texte ?? "?";
  // lignes de calcul ajoutées quand la machine arrive sur ce bloc de Fin
  if (!b.extra) return t;
  // les lignes « a = … » sont alignées sur le signe égal (grille à 3 colonnes)
  const ligne = (l, cls) => {
    const m = /^(\S+) ([=≈]) ([\s\S]*)$/.exec(l);
    return m ? `<span class="g ${cls}">${m[1]}</span><span class="g ${cls}">${m[2]}</span><span class="g d ${cls}">${m[3]}</span>`
             : `<span class="g plein ${cls}">${l}</span>`;
  };
  const ok = l => /^\S+ [=≈] /.test(l);
  // la dernière ligne apparue clignote en blanc
  const cl = l => "calc" + (b.extraNew != null && b.extra.indexOf(l) === b.extraNew ? " flash" : "");
  return `<div class="egal">${ligne(t, "")}${b.extra.filter(ok).map(l => ligne(l, cl(l))).join("")}</div>` +
         b.extra.filter(l => !ok(l)).map(l => `<div class="${cl(l)}">${l}</div>`).join("");
}
function ports(b){
  const d = DIM[b.type];
  if (b.type === "start" || b.type === "act") return [{ name:"next", x:d.w/2, y:d.h, dir:[0,1] }];
  if (b.type === "cond")  return [{ name:"oui", x:d.w/2, y:d.h, dir:[0,1], label:"Oui" },
                                  { name:"non", x:d.w, y:d.h/2, dir:[1,0], label:"Non" }];
  return [];
}

function rendu(){
  if (!selPort || selPort.port === "in") pointeur = null;
  document.body.classList.toggle("cible", !!(selPort && selPort.port !== "in"));
  document.querySelectorAll(".pal.out").forEach(p =>
    p.classList.toggle("pris", blocks.some(b => b.type === "out" && b.key === p.dataset.key)));
  document.querySelectorAll(".pal.start").forEach(p => p.classList.toggle("pris", blocks.some(b => b.type === "start")));
  ws.querySelectorAll(".block").forEach(e => e.remove());
  blocks.forEach(b => {
    const d = DIM[b.type];
    const el = document.createElement("div");
    el.className = "block " + b.type; el.dataset.id = b.id;
    el.style.left = b.x + "px"; el.style.top = b.y + "px";
    if (b.type === "start"){ el.style.width = d.w + "px"; el.style.height = d.h + "px"; }
    el.innerHTML = (b.type === "cond" ? '<div class="bord"></div>' : "") +
                   `<div class="face">${texteBloc(b)}</div>`;
    ports(b).forEach(p => {
      const pe = document.createElement("div");
      pe.className = "port"; pe.dataset.port = p.name;
      pe.style.left = p.x + "px"; pe.style.top = p.y + "px";
      if (links.some(l => l.from === b.id && l.port === p.name)) pe.classList.add("used");
      if (selPort && selPort.id === b.id && selPort.port === p.name) pe.classList.add("sel");
      pe.addEventListener("pointerdown", e => { e.stopPropagation(); clicPort(b.id, p.name); debutFleche(e, b.id, p.name); });
      el.appendChild(pe);
      if (p.label){
        const lb = document.createElement("div");
        lb.className = "plabel"; lb.dataset.port = p.name; lb.textContent = p.label;
        if (p.name === "oui"){ lb.style.left = (p.x + 16 / E) + "px"; lb.style.top = (p.y - 4) + "px"; }
        else { lb.style.left = (p.x - 6) + "px"; lb.style.top = (p.y - 30 / E) + "px"; }
        el.appendChild(lb);
      }
    });
    if (b.type !== "start"){
      const pin = document.createElement("div");
      pin.className = "port in"; pin.dataset.port = "in"; pin.title = "Entrée du bloc";
      pin.style.left = (d.w/2) + "px"; pin.style.top = "0px";
      if (links.some(l => l.to === b.id)) pin.classList.add("used");
      if (selPort && selPort.id === b.id && selPort.port === "in") pin.classList.add("sel");
      pin.addEventListener("pointerdown", e => { e.stopPropagation(); clicPort(b.id, "in"); });
      el.appendChild(pin);
    }
    {
      const x = document.createElement("div");
      x.className = "del"; x.textContent = "×"; x.title = "Supprimer ce bloc";
      x.addEventListener("pointerdown", e => { e.stopPropagation(); supprimerBloc(b.id); });
      el.appendChild(x);
    }
    el.addEventListener("pointerdown", e => dragBloc(e, b, el));
    ws.appendChild(el);
  });
  dessinerLiens(); dessinerTmp();
}

// courbe d'une flèche ; si elle remonte (boucle), elle passe sur le côté
function cheminFleche(x1, y1, dir, x2, y2, a, t){
  if (y2 < y1 - 20 && dir[1] === 1){
    const gauche = Math.min(a.x, t.x) - 70;
    const xs = gauche > 10 ? gauche : Math.max(a.x + DIM[a.type].w, t.x + DIM[t.type].w) + 70;
    const ym = (y1 + y2) / 2;
    return `M${x1} ${y1} C${x1} ${y1 + 70}, ${xs} ${y1 + 70}, ${xs} ${ym} C${xs} ${y2 - 70}, ${x2} ${y2 - 70}, ${x2} ${y2}`;
  }
  const k = Math.max(50, Math.min(140, Math.hypot(x2-x1, y2-y1) / 2));
  return `M${x1} ${y1} C${x1 + dir[0]*k} ${y1 + dir[1]*k}, ${x2} ${y2 - k}, ${x2} ${y2}`;
}
function dessinerLiens(){
  linksG.innerHTML = "";
  links.forEach((l, i) => {
    const a = blocks.find(b => b.id === l.from), t = blocks.find(b => b.id === l.to);
    if (!a || !t) return;
    const p = ports(a).find(p => p.name === l.port);
    const x1 = a.x + p.x, y1 = a.y + p.y;
    const x2 = t.x + DIM[t.type].w/2, y2 = t.y - 12 / E - 1;
    const dpath = cheminFleche(x1, y1, p.dir, x2, y2, a, t);
    const hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
    hit.setAttribute("d", dpath); hit.setAttribute("class", "hit");
    hit.addEventListener("pointerdown", e => { e.stopPropagation(); links.splice(i, 1); apresModif(); });
    const vis = document.createElementNS("http://www.w3.org/2000/svg", "path");
    vis.setAttribute("d", dpath); vis.setAttribute("class", "vis" + (l.lit ? " lit" : ""));
    vis.setAttribute("marker-end", l.lit ? "url(#flLit)" : "url(#fl)");
    linksG.appendChild(hit); linksG.appendChild(vis);
  });
}

/* ===================== Interactions ===================== */
function coordWs(e){ const r = ws.getBoundingClientRect(); return { x: (e.clientX - r.left) / E, y: (e.clientY - r.top) / E }; }

/* ---- zoom de la zone de travail (utile sur téléphone) ---- */
let E = 1;
try { E = parseFloat(localStorage.getItem("logimaths-zoom")) || 0; } catch(_){}
if (!E) E = window.innerWidth < 760 ? 0.7 : 1;
function appliquerEchelle(){
  E = Math.round(Math.min(1.3, Math.max(0.4, E)) * 100) / 100;
  document.documentElement.style.setProperty("--E", E);
  const W = Math.max(1200, Math.ceil(zone.clientWidth / E)), H = Math.max(1100, Math.ceil(zone.clientHeight / E));
  ws.style.width = W + "px"; ws.style.height = H + "px";
  ws.style.transform = `scale(${E})`;
  $("#wsWrap").style.width = W * E + "px"; $("#wsWrap").style.height = H * E + "px";
  try { localStorage.setItem("logimaths-zoom", E); } catch(_){}
  if (typeof dessinerLiens === "function" && blocks) dessinerLiens();
}
function zoomer(f){
  // on garde le centre de l'écran au même endroit
  const cx = (zone.scrollLeft + zone.clientWidth / 2) / E, cy = (zone.scrollTop + zone.clientHeight / 2) / E;
  E *= f; appliquerEchelle();
  zone.scrollLeft = cx * E - zone.clientWidth / 2; zone.scrollTop = cy * E - zone.clientHeight / 2;
}
function borner(b){
  const d = DIM[b.type];
  b.x = Math.max(0, Math.min(ws.clientWidth - d.w, b.x));
  b.y = Math.max(12, Math.min(ws.clientHeight - d.h - 12, b.y));
}

function clicPort(id, port){
  effacerEtats();
  // une sortie est sélectionnée et on touche un point d'entrée : la flèche se colle
  if (port === "in" && selPort && selPort.port !== "in") { relier(id); return; }
  // une entrée est sélectionnée et on touche un point de sortie : la flèche se colle aussi
  if (port !== "in" && selPort && selPort.port === "in") {
    const cible = selPort.id; selPort = { id, port }; relier(cible); return;
  }
  if (selPort && selPort.id === id && selPort.port === port) selPort = null;
  else selPort = { id, port };
  rendu();
  if (selPort) msg(port === "in"
    ? "Touche maintenant le point jaune de sortie (Oui, Non…) d'où part la flèche."
    : "Touche maintenant le point jaune d'entrée du bloc où la flèche doit arriver.", "");
}

function relier(toId){
  const to = blocks.find(b => b.id === toId);
  if (!selPort || selPort.port === "in" || to.type === "start" || toId === selPort.id) { selPort = null; rendu(); return; }
  links = links.filter(l => !(l.from === selPort.id && l.port === selPort.port));
  links.push({ from: selPort.id, port: selPort.port, to: toId });
  selPort = null; apresModif();
  msg("Flèche ajoutée.", "");
}

function dragBloc(e, b, el){
  if (e.button !== undefined && e.button !== 0) return;
  stopRun();
  const p0 = coordWs(e), ox = p0.x - b.x, oy = p0.y - b.y;
  let bouge = false;
  el.setPointerCapture(e.pointerId);
  if (e.pointerType === "touch"){ ws.querySelectorAll(".block.touch").forEach(x => x.classList.remove("touch")); el.classList.add("touch"); }
  const move = ev => {
    const p = coordWs(ev);
    if (!bouge && Math.hypot(p.x - p0.x, p.y - p0.y) < 5) return;
    if (!bouge) effacerEtats();
    bouge = true; el.classList.add("dragging");
    b.x = p.x - ox; b.y = p.y - oy; borner(b);
    el.style.left = b.x + "px"; el.style.top = b.y + "px";
    dessinerLiens();
  };
  const up = () => {
    el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
    el.classList.remove("dragging");
    if (bouge) sauver();
    else if (selPort) relier(b.id);
  };
  el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
}

function dragPalette(e, type, key, texte){
  e.preventDefault(); stopRun();
  if (type === "out" && blocks.some(b => b.type === "out" && b.key === key)){
    msg("⚠ Ce bloc de Fin est déjà posé. Tu peux faire arriver plusieurs flèches sur le même bloc.", "warn");
    return;
  }
  if (type === "start" && blocks.some(b => b.type === "start")){
    msg("⚠ Le bloc Début est déjà posé : une machine n'a qu'un seul début.", "warn");
    return;
  }
  const g = $("#ghost"); g.innerHTML = texte;
  const x0 = e.clientX, y0 = e.clientY; let bouge = false, dernier = { clientX: x0, clientY: y0 };
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_){}
  const move = ev => {
    dernier = { clientX: ev.clientX, clientY: ev.clientY };
    if (!bouge && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 6) return;
    bouge = true; g.style.display = "block";
    g.style.left = (ev.clientX - 20) + "px"; g.style.top = (ev.clientY - 15) + "px";
  };
  const up = evt => {
    const ev = evt.type === "pointercancel" ? dernier : evt;
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
    g.style.display = "none";
    const d = DIM[type]; let x, y;
    const zr = zone.getBoundingClientRect();
    if (!bouge){
      // simple toucher : on place le bloc au milieu de la partie visible
      if (type === "start"){ x = (zone.scrollLeft + zone.clientWidth / 2) / E - d.w / 2; y = zone.scrollTop / E + 30; }
      else ({ x, y } = placeLibre(type));
    } else if (ev.clientX >= zr.left && ev.clientX <= zr.right && ev.clientY >= zr.top && ev.clientY <= zr.bottom){
      const p = coordWs(ev); x = p.x - d.w/2; y = p.y - d.h/2;
    } else return;
    const b = { id: nextId++, type, x, y }; if (type !== "start") b.key = key; borner(b);
    blocks.push(b); apresModif();
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
}

/* ---- flèche qui suit la souris ---- */
function cibleProche(p){
  if (!selPort) return null;
  let best = null, dmin = 38 / Math.min(1, E);
  blocks.forEach(b => {
    if (b.type === "start" || b.id === selPort.id) return;
    const d = Math.hypot(p.x - (b.x + DIM[b.type].w/2), p.y - b.y);
    if (d < dmin){ dmin = d; best = b; }
  });
  return best;
}
function dessinerTmp(){
  tmpG.innerHTML = "";
  ws.querySelectorAll(".port.in.vise").forEach(x => x.classList.remove("vise"));
  if (!selPort || selPort.port === "in" || !pointeur) return;
  const a = blocks.find(b => b.id === selPort.id); if (!a) return;
  const p = ports(a).find(q => q.name === selPort.port);
  const x1 = a.x + p.x, y1 = a.y + p.y;
  let x2 = pointeur.x, y2 = pointeur.y, c2x = x2, c2y = y2;
  const c = cibleProche(pointeur);
  const k = Math.max(40, Math.min(130, Math.hypot(x2 - x1, y2 - y1) / 2));
  if (c){
    x2 = c.x + DIM[c.type].w/2; y2 = c.y - 12 / E - 1; c2x = x2; c2y = y2 - k;
    ws.querySelector(`.block[data-id="${c.id}"] .port.in`)?.classList.add("vise");
  }
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", `M${x1} ${y1} C${x1 + p.dir[0]*k} ${y1 + p.dir[1]*k}, ${c2x} ${c2y}, ${x2} ${y2}`);
  path.setAttribute("marker-end", "url(#flTmp)");
  tmpG.appendChild(path);
}
window.addEventListener("pointermove", e => {
  if (selPort && selPort.port !== "in"){ pointeur = coordWs(e); dessinerTmp(); }
});
// glisser depuis un point de sortie et relâcher sur un point d'entrée (ou un bloc)
function debutFleche(e, id, port){
  if (!selPort || selPort.id !== id || selPort.port !== port) return;
  pointeur = coordWs(e); dessinerTmp();
  const x0 = e.clientX, y0 = e.clientY;
  const up = ev => {
    window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
    if (Math.hypot(ev.clientX - x0, ev.clientY - y0) < 8) return; // simple clic : la flèche suit la souris
    const c = cibleProche(coordWs(ev));
    const sous = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".block");
    const cible = c ? c.id : (sous ? +sous.dataset.id : null);
    if (cible != null && cible !== id && blocks.find(b => b.id === cible).type !== "start") relier(cible);
    else { selPort = null; rendu(); msg("", ""); }
  };
  window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
}

ws.addEventListener("pointerdown", e => {
  if (e.target === ws || e.target.closest("svg") && !e.target.classList.contains("hit")){
    ws.querySelectorAll(".block.touch").forEach(x => x.classList.remove("touch"));
    const c = selPort && selPort.port !== "in" ? cibleProche(coordWs(e)) : null;
    if (c){ relier(c.id); return; }
    if (selPort){ selPort = null; rendu(); msg("", ""); }
  }
});

function dragNombre(e, n){
  e.preventDefault(); stopRun();
  const g = $("#ghost"); g.innerHTML = aff(act.nombres[n]);
  const x0 = e.clientX, y0 = e.clientY; let bouge = false;
  const dansCase = ev => {
    const s = ws.querySelector(".block.start"); if (!s) return false;
    const r = s.getBoundingClientRect(), m = 25;
    return ev.clientX > r.left - m && ev.clientX < r.right + m && ev.clientY > r.top - m && ev.clientY < r.bottom + m;
  };
  const move = ev => {
    if (!bouge && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 6) return;
    bouge = true; g.style.display = "block";
    g.style.left = (ev.clientX - 20) + "px"; g.style.top = (ev.clientY - 18) + "px";
    ws.querySelector(".slot")?.classList.toggle("survol", dansCase(ev));
  };
  const up = ev => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
    g.style.display = "none";
    // un simple toucher place aussi le nombre dans la case (pratique sur tablette)
    if (!bouge || dansCase(ev)) placerNombre(n);
    else majEtats();
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
}
function placerNombre(n){
  nCourant = n; effacerEtats();
  document.querySelectorAll(".num").forEach(b => b.classList.toggle("cur", b.dataset.n == n));
  msg(`${Nom(act.nombres[n])}. Clique sur « Lancer la vérification ».`, "");
}
function lancer(){
  if (nCourant == null){ msg("⚠ Glisse d'abord une valeur dans la case jaune.", "warn"); return; }
  testerUn(nCourant);
}

function placeLibre(type){
  // cherche une place visible où le nouveau bloc ne chevauche aucun autre bloc
  const d = DIM[type], m = 45;
  const x0 = zone.scrollLeft / E + 20, y0 = zone.scrollTop / E + 40;
  const x1 = Math.min(ws.clientWidth, (zone.scrollLeft + zone.clientWidth) / E) - d.w - 20;
  const y1 = Math.min(ws.clientHeight, (zone.scrollTop + zone.clientHeight) / E) - d.h - 20;
  const libre = (x, y) => blocks.every(b => {
    const e = DIM[b.type];
    return x + d.w + m < b.x || b.x + e.w + m < x || y + d.h + m < b.y || b.y + e.h + m < y;
  });
  for (let y = y0; y <= Math.max(y0, y1); y += 30)
    for (let x = x0; x <= Math.max(x0, x1); x += 30)
      if (libre(x, y)) return { x, y };
  const n = blocks.length % 6;
  return { x: (zone.scrollLeft + zone.clientWidth/2) / E - d.w/2 + n*30, y: (zone.scrollTop + zone.clientHeight/2) / E - d.h/2 + n*30 };
}

function supprimerBloc(id){
  stopRun();
  blocks = blocks.filter(b => b.id !== id);
  links = links.filter(l => l.from !== id && l.to !== id);
  if (selPort && selPort.id === id) selPort = null;
  apresModif();
}
function apresModif(){ sauver(); rendu(); effacerEtats(); }

/* ===================== Exécution de la machine ===================== */
const attendre = ms => new Promise(r => setTimeout(r, ms));
function stopRun(){ runToken++; }
function msg(t, cls){ const m = $("#msg"); m.innerHTML = t; m.className = cls || ""; }

// efface le chemin blanc et les couleurs (appelé dès que le logigramme change)
function effacerEtats(){
  stopRun(); reinitLumieres();
  blocks.forEach(b => { if (b.type === "start") delete b.val; });
  links.forEach(l => delete l.lit);
  document.querySelectorAll(".num").forEach(x => { x.classList.remove("ok","ko"); x.classList.toggle("cur", x.dataset.n == nCourant); });
  majEtats();
}
function majEtats(){
  ws.querySelectorAll(".block").forEach(el => {
    const b = blocks.find(x => x.id == el.dataset.id);
    if (!b) return;
    el.classList.toggle("lit", !!b.lit);
    el.classList.toggle("ok", b.res === "ok");
    el.classList.toggle("ko", b.res === "ko");
    el.classList.toggle("stuck", !!b.stuck);
    if (b.type === "start" || b.type === "out") el.querySelector(".face").innerHTML = texteBloc(b);
    if (b.type === "out") el.classList.toggle("calcul", !!b.extra);
    el.querySelectorAll(".plabel").forEach(lb => lb.classList.toggle("lit", b.portLit === lb.dataset.port));
  });
  dessinerLiens();
}
function reinitLumieres(){
  blocks.forEach(b => { delete b.lit; delete b.res; delete b.stuck; delete b.portLit; delete b.cur; delete b.extra; delete b.extraNew; });
  links.forEach(l => delete l.lit);
}

// Fait passer n dans la machine. Renvoie "ok", "ko", "bloque" ou "boucle".
async function executer(i, vitesse, token){
  reinitLumieres();
  const n = act.nombres[i];
  const start = blocks.find(b => b.type === "start");
  if (!start) return "nodebut";
  start.val = i;
  let cur = start, pas = 0, v = act.etatInitial ? act.etatInitial(n) : n, nbActions = 0;
  const visites = {}, dejaVu = new Set();
  // la machine accélère quand elle repasse plusieurs fois par les mêmes blocs (boucle)
  const delai = b => vitesse * ((visites[b.id] || 0) > 2 ? 0.35 : 1);
  dernierBilan = "";
  cur.lit = true; majEtats(); await attendre(vitesse);
  while (true){
    if (token !== runToken) return null;
    visites[cur.id] = (visites[cur.id] || 0) + 1;
    // même bloc avec la même valeur de n : la machine ne s'arrêtera jamais
    const etat = cur.id + "|" + JSON.stringify(v);
    if (dejaVu.has(etat)){ cur.stuck = true; majEtats(); return "boucle"; }
    dejaVu.add(etat);
    if (cur.type === "out"){
      if (act.detailFin){
        const d = act.detailFin(n, cur.key);
        if (d){
          // les étapes du calcul apparaissent une par une, avec un petit clignotement blanc
          await attendre(vitesse / 2); if (token !== runToken) return null;
          cur.lit = false; cur.extra = [];
          for (const l of d){
            cur.extra.push(l); cur.extraNew = cur.extra.length - 1; majEtats();
            await attendre(Math.max(450, vitesse * 1.3)); if (token !== runToken) return null;
          }
          delete cur.extraNew;
        }
      }
      const verdict = act.valide ? act.valide(n, v, cur.key) : cur.key === act.attendu(n);
      if (verdict === "etape"){ cur.lit = false; cur.stuck = true; majEtats(); return "etape"; }
      const bon = verdict === true;
      cur.lit = false; cur.res = bon ? "ok" : "ko"; majEtats();
      if (bon && act.bilan) dernierBilan = act.etatInitial ? act.bilan(n, v) : act.bilan(n, nbActions, v);
      return bon ? "ok" : "ko";
    }
    let port = "next";
    if (cur.type === "act"){
      const a = act.actions.find(a => a.key === cur.key);
      const nv = a.f(v);
      if (nv == null){ cur.stuck = true; majEtats(); return "sansvaleur"; }
      v = nv; nbActions++;
      if (!act.etatInitial || act.variables) start.cur = v;
      majEtats(); await attendre(delai(cur)/2);
      if (token !== runToken) return null;
    }
    if (cur.type === "cond"){
      const c = act.conditions.find(c => c.key === cur.key);
      const res = c.test(v);
      if (res == null){ cur.stuck = true; majEtats(); return "sansvaleur"; }
      port = res ? "oui" : "non";
      cur.portLit = port; majEtats(); await attendre(delai(cur)/2);
      if (token !== runToken) return null;
    }
    const l = links.find(l => l.from === cur.id && l.port === port);
    if (!l){ cur.stuck = true; majEtats(); return "bloque"; }
    // dans une boucle, on éteint l'ancien passage pour voir le tour en cours
    if (visites[l.to]) { blocks.forEach(b => { if (b !== start) { delete b.lit; delete b.portLit; } }); links.forEach(x => delete x.lit); }
    l.lit = true; majEtats(); await attendre(delai(cur)/2);
    if (token !== runToken) return null;
    cur = blocks.find(b => b.id === l.to);
    cur.lit = true; majEtats(); await attendre(delai(cur));
    if (++pas > 300) return "boucle";
  }
}

function texteResultat(i, r){
  const n = nom(act.nombres[i]);
  if (r === "ok") return `✔ Pour ${n}, ta machine donne la bonne réponse.` + (dernierBilan ? " " + dernierBilan : "");
  if (r === "ko") return `✘ Pour ${n}, ta machine se trompe !`;
  if (r === "bloque") return `⚠ Pour ${n}, la machine s'arrête : il manque une flèche (bloc en orange).`;
  if (r === "etape") return `⚠ Pour ${n}, ta machine arrive à la bonne conclusion, mais il manque une étape de calcul ou elle n'est pas dans le bon ordre (bloc en orange).`;
  if (r === "sansvaleur") return `⚠ Pour ${n}, la machine utilise ${(act.variables || ["une variable"]).join(", ")} alors qu'elle n'a pas encore de valeur (bloc en orange) !`;
  if (r === "nodebut") return "⚠ Ta machine n'a pas de bloc Début : glisse-le depuis le menu.";
  return `⚠ Pour ${n}, la machine tourne en rond : elle repasse au même endroit sans que n change (bloc en orange) !`;
}

async function testerUn(n){
  stopRun(); const token = runToken;
  document.querySelectorAll(".num").forEach(b => b.classList.toggle("cur", b.dataset.n == n));
  msg(`La machine teste ${nom(act.nombres[n])}…`, "");
  const r = await executer(n, VITESSE, token);
  if (r === null) return;
  if (r === "nodebut"){ msg(texteResultat(n, r), "warn"); return; }
  const btn = document.querySelector(`.num[data-n="${n}"]`);
  btn.classList.remove("ok","ko"); btn.classList.add(r === "ok" ? "ok" : "ko");
  msg(texteResultat(n, r), r === "ok" ? "ok" : r === "ko" ? "ko" : "warn");
}

async function testerTous(){
  stopRun(); const token = runToken;
  if (!blocks.some(b => b.type === "start")){ msg(texteResultat(0, "nodebut"), "warn"); return; }
  document.querySelectorAll(".num").forEach(b => b.classList.remove("ok","ko","cur"));
  let erreurs = 0;
  for (let n = 0; n < act.nombres.length; n++){
    const btn = document.querySelector(`.num[data-n="${n}"]`);
    document.querySelectorAll(".num").forEach(b => b.classList.remove("cur")); btn.classList.add("cur");
    msg(`La machine teste ${nom(act.nombres[n])}…`, "");
    const r = await executer(n, 280, token);
    if (r === null) return;
    btn.classList.add(r === "ok" ? "ok" : "ko");
    if (r !== "ok") erreurs++;
    await attendre(450);
    if (token !== runToken) return;
  }
  document.querySelectorAll(".num").forEach(b => b.classList.remove("cur"));
  if (erreurs === 0){
    msg("✔ Ta machine donne la bonne réponse pour toutes les valeurs !", "ok");
    $("#bravoTxt").textContent = "Ta machine de vérification fonctionne pour toutes les valeurs testées.";
    $("#bravo").style.display = "flex";
  } else {
    msg(`✘ Ta machine se trompe pour ${erreurs} valeur${erreurs > 1 ? "s" : ""} (en rouge). Glisse-la dans la case et lance la vérification pour voir le chemin.`, "ko");
  }
}

/* ===================== Démarrage ===================== */
$("#zMoins").onclick = () => zoomer(1 / 1.2);
$("#zPlus").onclick = () => zoomer(1.2);
$("#consigne").onclick = () => $("#consigne").classList.toggle("ouvert");
let tRedim = null;
window.addEventListener("resize", () => { clearTimeout(tRedim); tRedim = setTimeout(appliquerEchelle, 150); });

document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("selectstart", e => { if (e.target.closest && e.target.closest("#palette,#ws,#nombres")) e.preventDefault(); });
ACTIVITES.forEach((a, i) => { const o = document.createElement("option"); o.value = i; o.textContent = a.titre; $("#choixAct").appendChild(o); });
$("#choixAct").onchange = e => { stopRun(); selPort = null; chargerActivite(+e.target.value); };
$("#btnTous").onclick = testerTous;
$("#btnLancer").onclick = lancer;
let viderTimer = null;
$("#btnVider").onclick = () => {
  const bt = $("#btnVider");
  if (!viderTimer){
    bt.textContent = "⚠ Clique encore pour confirmer"; bt.style.borderColor = "var(--ko)";
    viderTimer = setTimeout(() => { viderTimer = null; bt.textContent = "🗑 Tout effacer"; bt.style.borderColor = ""; }, 3000);
    return;
  }
  clearTimeout(viderTimer); viderTimer = null; bt.textContent = "🗑 Tout effacer"; bt.style.borderColor = "";
  stopRun(); selPort = null; etatInitial(); apresModif(); msg("Logigramme effacé.", "");
};
$("#btnFermer").onclick = () => { $("#bravo").style.display = "none"; };
appliquerEchelle();
chargerActivite(0);
</script>
